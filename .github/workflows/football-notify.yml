name: Man City 賽後通知

on:
  schedule:
    # 台灣時間 20:30～06:30，每 30 分鐘檢查一次（cron 用 UTC：12:30～22:30）
    - cron: "30 12-22 * * *"
    - cron: "0 13-22 * * *"
  workflow_dispatch: {}      # 也可以在 GitHub 上手動執行

permissions:
  contents: write  # 需要把「已通知過的比賽」紀錄寫回 repo

concurrency:
  group: football-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 檢查比賽並推送
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python football_notify/notify.py

      - name: 儲存已通知紀錄
        run: |
          if [ -n "$(git status --porcelain football_notify/state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add football_notify/state
            git commit -m "Update notified fixtures"
            git push
          fi
