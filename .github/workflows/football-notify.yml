name: Man City 賽後通知

on:
  # 由 cron-job.org 定時呼叫 GitHub API 觸發（GitHub 內建排程延遲、跳過太嚴重，已停用）
  # 時段：台灣時間 週二、三、五、六、日 20:00～23:30，以及 週一、三、四、六、日 00:00～06:30，每 30 分鐘
  # 也可以在 GitHub 上手動執行
  workflow_dispatch:
    inputs:
      test_latest:
        description: "測試模式：用最近一場已完賽的比賽產生通知，只印在 Log、不推送"
        type: boolean
        default: false
      test_push:
        description: "測試模式下也推送到手機"
        type: boolean
        default: false
      test_league:
        description: "測試模式只跑哪個賽事"
        type: choice
        options: [all, eng.1, uefa.champions]
        default: all

permissions:
  contents: write  # 需要把「已通知過的比賽」紀錄寫回 repo

concurrency:
  group: football-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 拿分支的最新版本（含上一輪寫回的已通知紀錄），避免排隊的執行讀到舊紀錄而重複推送
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 檢查比賽並推送
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_LATEST: ${{ inputs.test_latest && '1' || '' }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '' }}
          TEST_LEAGUE: ${{ inputs.test_league != 'all' && inputs.test_league || '' }}
        run: python football_notify/notify.py

      - name: 儲存已通知紀錄
        run: |
          if [ -n "$(git status --porcelain football_notify/state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add football_notify/state
            git commit -m "Update notified fixtures"
            git push
          fi
