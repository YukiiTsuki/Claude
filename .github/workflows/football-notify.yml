name: Man City 賽後通知

on:
  schedule:
    # 台灣時間 20:30～隔天 06:30，每 30 分鐘檢查一次（cron 用 UTC：12:30～22:30）
    # 只在週二、三、五、六、日晚上開始的時段跑（UTC 星期：0=日 2=二 3=三 5=五 6=六）
    # → 涵蓋台灣週三、四清晨（歐冠／英超週間）、週六清晨（英超週五晚）、週末晚上到週一清晨（英超）
    - cron: "30 12-22 * * 0,2,3,5,6"
    - cron: "0 13-22 * * 0,2,3,5,6"
  workflow_dispatch:         # 也可以在 GitHub 上手動執行
    inputs:
      test_latest:
        description: "測試模式：用最近一場已完賽的比賽產生通知，只印在 Log、不推送"
        type: boolean
        default: false
      test_push:
        description: "測試模式下也推送到手機"
        type: boolean
        default: false
      test_league:
        description: "測試模式只跑哪個賽事"
        type: choice
        options: [all, eng.1, uefa.champions]
        default: all

permissions:
  contents: write  # 需要把「已通知過的比賽」紀錄寫回 repo

concurrency:
  group: football-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 檢查比賽並推送
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_LATEST: ${{ inputs.test_latest && '1' || '' }}
          TEST_PUSH: ${{ inputs.test_push && '1' || '' }}
          TEST_LEAGUE: ${{ inputs.test_league != 'all' && inputs.test_league || '' }}
        run: python football_notify/notify.py

      - name: 儲存已通知紀錄
        run: |
          if [ -n "$(git status --porcelain football_notify/state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add football_notify/state
            git commit -m "Update notified fixtures"
            git push
          fi
