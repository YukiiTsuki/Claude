name: Man City site (update data + deploy)

on:
  # 由 cron-job.org 定時呼叫 GitHub API 觸發（GitHub 內建排程延遲太嚴重，已停用）
  # 時段：台灣時間每天 08:50（ref: mci-match-webpage）
  # 也可以在 GitHub 上手動執行
  workflow_dispatch:
  push:
    paths:
      - "mancity_site/**"
      - ".github/workflows/mancity-site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mancity-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch data from ESPN
        run: python mancity_site/fetch_data.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mancity_site/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
